<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questtick — Подтверждение нового email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/auth.css" />
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var token = new URLSearchParams(window.location.search).get('token');
      if (!token) {
        document.getElementById('title').textContent = 'Ссылка недействительна';
        document.getElementById('msg').textContent = 'Попробуйте запросить смену email повторно.';
        return;
      }
      fetch('https://api.questtick.com/api/confirm-email-change?token=' + encodeURIComponent(token))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.ok) {
            document.getElementById('title').textContent = 'Email успешно изменён';
            document.getElementById('msg').innerHTML = 'Новый email подтверждён. <a href="/">Войти</a>';
          } else {
            document.getElementById('title').textContent = 'Ошибка подтверждения';
            document.getElementById('msg').textContent = d.error || 'Ссылка недействительна или истекла.';
          }
        })
        .catch(function () {
          document.getElementById('title').textContent = 'Ошибка сети';
          document.getElementById('msg').textContent = 'Попробуйте ещё раз позже.';
        });
    });
  </script>
</head>
<body>
  <div class="auth-status">
    <h2 id="title">Подтверждаем новый email…</h2>
    <p id="msg">Пожалуйста, подождите</p>
  </div>
</body>
</html>
