<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Altcoin Pump Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── HP Design System tokens ── */
    :root {
      --canvas:        #ffffff;
      --paper:         #ffffff;
      --cloud:         #f7f7f7;
      --fog:           #e8e8e8;
      --steel:         #c2c2c2;
      --hairline:      #e8e8e8;
      --ink:           #1a1a1a;
      --ink-deep:      #000000;
      --on-ink:        #ffffff;
      --charcoal:      #3d3d3d;
      --graphite:      #636363;
      --primary:       #024ad8;
      --primary-bright:#296ef9;
      --primary-deep:  #0e3191;
      --primary-soft:  #c9e0fc;
      --bloom-coral:   #ff5050;
      --bloom-deep:    #b3262b;
      /* Semantic signal colors (functional, not brand) */
      --bullish:       #16a34a;
      --bullish-bg:    #f0fdf4;
      --caution:       #b45309;
      --caution-bg:    #fffbeb;
      --neutral-bar:   #c2c2c2;
      /* Shadows */
      --shadow-soft:   0 2px 8px rgba(26, 26, 26, 0.08);
      --shadow-float:  0 8px 24px rgba(26, 26, 26, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    body {
      font-family: 'Manrope', Arial, sans-serif;
      background: var(--cloud);
      color: var(--ink);
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      max-width: 1900px;
      margin: 0 auto;
    }

    .last-update {
      font-size: 12px;
      color: var(--graphite);
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-family: 'Manrope', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      padding: 0 20px;
      height: 40px;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* outline-ink on light bg */
    .btn-refresh {
      background: var(--canvas);
      color: var(--ink);
      border: 1px solid var(--ink);
      text-transform: none;
      letter-spacing: 0;
      font-weight: 600;
      font-size: 13px;
    }
    /* primary blue CTA */
    .btn-analyze-all {
      background: var(--primary);
      color: var(--on-ink);
    }
    .btn-analyze-all:active { background: var(--primary-deep); }

    /* ── Top bar card (filters + sort in one card) ── */
    .topbar {
      background: var(--paper);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      margin: 20px 32px 0;
      overflow: hidden;
    }

    .filters {
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--hairline);
    }
    .filters-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--charcoal);
      font-weight: 500;
    }
    .filter-group label { white-space: nowrap; }
    .filter-group input {
      background: var(--canvas);
      border: 1px solid var(--steel);
      border-radius: 4px;
      color: var(--ink);
      padding: 0 12px;
      height: 36px;
      width: 90px;
      font-size: 13px;
      font-family: 'Manrope', Arial, sans-serif;
      font-weight: 600;
    }
    .filter-group input:focus { outline: none; border-color: var(--ink); }
    .filter-pill { background: var(--canvas); color: var(--charcoal); border: 1px solid var(--steel); padding: 0 12px; height: 32px; font-size: 12px; font-weight: 600; border-radius: 9999px; text-transform: none; letter-spacing: 0; }
    .filter-pill.active { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

    /* ── Metrics ── */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      padding: 24px 32px 0;
      background: var(--cloud);
    }
    .metric-card {
      background: var(--paper);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: var(--shadow-soft);
    }
    .metric-card .label {
      font-size: 10px;
      color: var(--graphite);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .metric-card .value {
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.0;
    }
    .metric-card .value.blue   { color: var(--primary); }
    .metric-card .value.green  { color: var(--bullish); }

    /* ── Sort bar (inside topbar card) ── */
    .sort-bar {
      padding: 10px 24px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .sort-bar span {
      font-size: 11px;
      color: var(--graphite);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-right: 4px;
    }
    .sort-btn {
      background: var(--canvas);
      color: var(--charcoal);
      border: 1px solid var(--steel);
      padding: 0 16px;
      height: 32px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 9999px;
      text-transform: none;
      letter-spacing: 0;
    }
    .sort-btn.active {
      background: var(--ink);
      color: var(--on-ink);
      border-color: var(--ink);
    }

    .td-natr { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
    .natr-low  { color: #16a34a; }
    .natr-mid  { color: #b45309; }
    .natr-high { color: #b3262b; }
    .natr-dim  { color: #c2c2c2; font-weight: 500; }

    /* ── Coins table ── */
    .table-wrap {
      padding: 16px 32px 64px;
      background: var(--cloud);
    }

    .table-card {
      background: var(--paper);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .coins-table {
      width: 100%;
      border-collapse: collapse;
    }

    .coins-table thead th {
      padding: 12px 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--graphite);
      text-align: left;
      border-bottom: 1px solid var(--hairline);
      background: var(--cloud);
      white-space: nowrap;
    }
    .coins-table thead th.th-right { text-align: right; }

    .coin-row {
      border-bottom: 1px solid var(--hairline);
      transition: background 0.12s;
    }
    .coin-row:last-child { border-bottom: none; }
    .coin-row:hover { background: var(--cloud); }
    .coin-row.clickable { cursor: pointer; }

    /* Signal left-edge indicator */
    .coin-row.bullish { box-shadow: inset 4px 0 0 var(--bullish); }
    .coin-row.caution  { box-shadow: inset 4px 0 0 var(--caution); }
    .coin-row.neutral  { box-shadow: inset 4px 0 0 var(--neutral-bar); }

    .coins-table td {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      vertical-align: middle;
    }

    .td-name { min-width: 200px; }
    .coin-name   { display: block; font-size: 16px; font-weight: 700; color: var(--ink); }
    .coin-symbol { display: block; font-size: 11px; color: var(--graphite); font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; margin-top: 2px; }

    .td-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .td-change { font-weight: 700; color: var(--bullish); white-space: nowrap; }

    .td-action { text-align: right; white-space: nowrap; min-width: 160px; }

    /* outline-primary in-table button */
    .btn-analyze-one {
      background: var(--canvas);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 0 16px;
      height: 34px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Chevron toggle icon */
    .chevron {
      display: inline-block;
      margin-left: 8px;
      font-size: 11px;
      color: var(--graphite);
      transition: transform 0.2s;
      font-style: normal;
    }

    /* ── Drilldown row ── */
    .drilldown-row td {
      padding: 0;
      background: var(--cloud);
      border-bottom: 1px solid var(--hairline);
    }

    .dd-loading {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      font-size: 13px;
      color: var(--graphite);
      font-weight: 600;
    }

    .dd-error {
      padding: 16px 24px;
      font-size: 13px;
      color: var(--bloom-deep);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dd-content {
      padding: 20px 24px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .dd-signal { flex-shrink: 0; padding-top: 1px; }
    .dd-text   { flex: 1; min-width: 0; }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--graphite);
      font-size: 14px;
      font-weight: 600;
    }

    /* ── Signal badge ── */
    .signal-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .signal-badge.bullish { background: var(--bullish-bg);  color: var(--bullish); }
    .signal-badge.caution { background: var(--caution-bg);  color: var(--caution); }
    .signal-badge.neutral { background: var(--fog);         color: var(--graphite); }

    /* ── Analysis block ── */
    .analysis-block {
      border-top: 1px solid var(--hairline);
      padding-top: 12px;
      margin-top: 4px;
    }
    .analysis-row {
      font-size: 14px;
      color: var(--charcoal);
      margin-bottom: 8px;
      line-height: 1.55;
    }
    .analysis-row strong { color: var(--ink); font-weight: 700; }

    .analysis-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .pill {
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .pill.strength-high { background: var(--bullish-bg);      color: var(--bullish); }
    .pill.strength-mid  { background: #fff7ed;                 color: #c2410c; }
    .pill.strength-low  { background: var(--fog);              color: var(--graphite); }
    .pill.ob-high       { background: #fff1f1;                 color: var(--bloom-deep); }
    .pill.ob-mid        { background: var(--caution-bg);       color: var(--caution); }
    .pill.ob-low        { background: var(--bullish-bg);       color: var(--bullish); }
    .pill.action        { background: var(--primary-soft);     color: var(--primary-deep); }
    .pill.news-yes      { background: var(--primary-soft);     color: var(--primary-deep); }
    .pill.news-no       { background: var(--fog);              color: var(--graphite); }

    /* ── Spinner / states ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--fog);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .analyzing-label {
      font-size: 12px;
      color: var(--graphite);
      display: flex;
      align-items: center;
      font-weight: 600;
    }
    .error-label {
      font-size: 12px;
      color: var(--bloom-deep);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .btn-retry {
      background: #fff1f1;
      color: var(--bloom-deep);
      border: 1px solid #fca5a5;
      font-size: 11px;
      padding: 0 10px;
      height: 26px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    /* ── Loading overlay ── */
    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 64px);
      background: var(--cloud);
      color: var(--graphite);
    }
    .loading-overlay .big-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--fog);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    .loading-overlay p {
      font-size: 14px;
      font-weight: 600;
      color: var(--charcoal);
    }

    /* ── Error banner ── */
    .error-banner {
      margin: 16px 32px 0;
      background: #fff1f1;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--bloom-deep);
      font-size: 13px;
      font-weight: 600;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--graphite);
      font-size: 14px;
      font-weight: 600;
    }

    /* ── Chart ── */
    .btn-chart {
      background: var(--canvas);
      color: var(--graphite);
      border: 1px solid var(--steel);
      font-size: 11px;
      font-weight: 700;
      padding: 0 10px;
      height: 26px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 6px;
    }
    .btn-chart.active {
      background: var(--ink);
      color: var(--on-ink);
      border-color: var(--ink);
    }
    .chart-wrap {
      padding: 12px 24px 16px;
      border-top: 1px solid var(--hairline);
      background: #0f1117;
      border-radius: 0 0 16px 16px;
    }
    .chart-label {
      font-size: 10px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .chart-error {
      font-size: 12px;
      color: #f87171;
      font-weight: 600;
      padding: 8px 0;
    }
    .chart-loading {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      padding: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #334155;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .td-natr { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .natr-low  { color: #16a34a; }
    .natr-mid  { color: #b45309; }
    .natr-high { color: #b3262b; }
    .natr-dim  { color: #c2c2c2; font-weight: 500; }

    /* ── Coins table ── */
    .table-wrap { padding: 16px 32px 64px; background: var(--cloud); }
    .table-card { background: var(--paper); border-radius: 16px; box-shadow: var(--shadow-soft); overflow: hidden; }
    .coins-table { width: 100%; border-collapse: collapse; }

    .chart-label { font-size: 10px; color: #64748b; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; }
    .chart-error { font-size: 12px; color: #f87171; font-weight: 600; padding: 8px 0; }
    .chart-loading { font-size: 12px; color: #64748b; font-weight: 600; padding: 8px 0; display: flex; align-items: center; gap: 8px; }
    .chart-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #334155; border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.7s linear infinite; }
    .btn-chart-row { background: var(--canvas); color: var(--ink); border: 1px solid var(--steel); font-size: 10px; font-weight: 700; padding: 0 8px; height: 34px; border-radius: 4px; letter-spacing: 0.3px; margin-right: 6px; vertical-align: middle; line-height: 1; }
    .btn-chart-row svg { display: block; }
    .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .popup-content { background: #0f1117; border-radius: 12px; padding: 24px; width: 720px; max-width: 94vw; box-shadow: 0 16px 48px rgba(0,0,0,0.4); }
    .popup-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .popup-title { font-size: 14px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.5px; text-transform: uppercase; }
    .popup-close { background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer; padding: 0; height: auto; width: auto; text-transform: none; letter-spacing: 0; }
    .popup-close:hover { color: #f1f5f9; }
    .popup-body .chart-label { font-size: 10px; color: #64748b; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 8px; }
    .popup-body .chart-loading { font-size: 13px; color: #64748b; font-weight: 600; padding: 20px 0; display: flex; align-items: center; gap: 8px; }
    .popup-body .chart-error { font-size: 13px; color: #f87171; font-weight: 600; padding: 20px 0; }
    .filter-pill { background: var(--canvas); color: var(--charcoal); border: 1px solid var(--steel); padding: 0 12px; height: 32px; font-size: 12px; font-weight: 600; border-radius: 9999px; text-transform: none; letter-spacing: 0; cursor: pointer; }
    .filter-pill:hover { opacity: 0.8; }
    .filter-pill.active { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
    @media (max-width: 768px) {
      .topbar { margin: 12px 12px 0; border-radius: 12px; }
      .filters { padding: 10px 14px; gap: 12px; flex-direction: column; align-items: stretch; }
      .last-update { display: block; white-space: normal; }
      .filter-group label { font-size: 12px; }
      .filter-pill { font-size: 13px; padding: 0 14px; height: 34px; }
      .filters-right { margin-left: 0; width: auto; }
      .btn-refresh, .btn-analyze-all { display: none; }
      .last-update { font-size: 10px; }
      .metrics { padding: 12px 12px 0; gap: 8px; grid-template-columns: repeat(2,1fr); }
      .metric-card:nth-child(2), .metric-card:nth-child(4) { display: none; }
      .metric-card { padding: 12px 14px; border-radius: 12px; }
      .metric-card .value { font-size: 20px; }
      .table-wrap { padding: 8px 12px 32px; }
      .table-card { border-radius: 12px; }
      .coins-table thead th:nth-child(2),
      .coins-table thead th:nth-child(4),
      .coins-table thead th:nth-child(5),
      .coin-row td:nth-child(2),
      .coin-row td:nth-child(4),
      .coin-row td:nth-child(5) { display: none; }
      .coins-table thead th { padding: 8px 10px; font-size: 10px; }
      .coins-table td { padding: 10px 10px; font-size: 13px; }
      .td-name { min-width: auto; }
      .btn-chart-row { padding: 0 6px; margin-right: 4px; }
      .btn-analyze-one { font-size: 10px; padding: 0 10px; height: 28px; }
      .dd-content { padding: 12px 14px; flex-direction: column; gap: 12px; }
      .dd-content .analysis-row { font-size: 13px; }
      .popup-content { padding: 16px; width: 96vw; }
      .loading-overlay p { font-size: 13px; }
      .error-banner { margin: 12px 12px 0; font-size: 12px; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
var STABLE_SYMBOLS = new Set(['usdt','usdc','busd','dai','tusd','usdp','gusd','frax','lusd','usdd','pyusd']);
var CACHE_TTL_MS = 2*60*1000, ANALYZE_DELAY_MS = 400;

var state = {
  coins:[], analysisCache:{}, openDrilldowns:new Set(),
  chartData:{}, natrData:{}, chartPopup:null,
  lastUpdate:null, cacheExpires:0, loading:false, error:null,
  minVolume:100, minChange:1, sortCol:'price_change_percentage_24h', sortDir:'desc',
  analyzingAll:false, analyzeAllAbort:false,
};

function fmt(n){if(n==null)return'—';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(4);}
function fmtPrice(p){if(p==null)return'—';if(p>=1)return'$'+p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(p>=0.01)return'$'+p.toFixed(4);return'$'+p.toFixed(8);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function escHtml(s){if(typeof s!=='string')return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function setSort(col){
  if(state.sortCol===col){state.sortDir=state.sortDir==='asc'?'desc':'asc';}
  else{state.sortCol=col;state.sortDir='desc';}
  render();
}

function filteredCoins(){
  var minVol=(state.minVolume||0)*1e6,minChg=state.minChange||0;
  var coins=state.coins.filter(function(c){return !STABLE_SYMBOLS.has(c.symbol.toLowerCase())&&(c.total_volume||0)>=minVol&&(c.price_change_percentage_24h||0)>=minChg;});
  coins=[].concat(coins).sort(function(a,b){
    var va=a[state.sortCol],vb=b[state.sortCol];
    if(typeof va==='string')return state.sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    return state.sortDir==='asc'?(va||0)-(vb||0):(vb||0)-(va||0);
  });
  return coins;
}

async function fetchCoins(){
  var now=Date.now();
  if(state.coins.length>0&&now<state.cacheExpires)return;
  state.loading=true;state.error=null;render();
  try{
    var res=await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
    if(!res.ok)throw new Error('Binance HTTP '+res.status);
    var data=await res.json();
    state.coins=data.filter(function(t){return t.symbol.endsWith('USDT')&&!STABLE_SYMBOLS.has(t.symbol.replace('USDT','').toLowerCase())&&t.symbol!=='USDTUSDT';}).map(function(t){
      var sym=t.symbol.replace('USDT','').toLowerCase();
      return{symbol:sym,name:sym.toUpperCase(),current_price:parseFloat(t.lastPrice),total_volume:Math.round(parseFloat(t.quoteVolume)),price_change_percentage_24h:parseFloat(t.priceChangePercent)};}).sort(function(a,b){return b.total_volume-a.total_volume;});
    state.lastUpdate=new Date();
    state.cacheExpires=now+CACHE_TTL_MS;
    fetchAllNATR(filteredCoins());
  }catch(err){state.error='Ошибка загрузки Binance Futures: '+err.message;}
  state.loading=false;render();
}
async function refreshCoins(){state.cacheExpires=0;await fetchCoins();}

async function analyzeCoin(coin){
  var key=coin.symbol;
  state.analysisCache[key]={status:'loading',result:null};render();
  var nd=state.natrData[coin.symbol];
  var natrVal=nd&&nd!=='loading'&&nd!=='error'?nd.value:null;
  try{
    var res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:coin.name,symbol:coin.symbol.toUpperCase(),
        change24h:(coin.price_change_percentage_24h||0).toFixed(2),
        volume:Math.round(coin.total_volume||0),price:coin.current_price||0,natr:natrVal})});
    var json=await res.json();
    state.analysisCache[key]=(!res.ok||json.error)?{status:'error',result:null,error:json.error||'Ошибка сервера'}:{status:'ok',result:json};
  }catch(err){state.analysisCache[key]={status:'error',result:null,error:'Сетевая ошибка: '+err.message};}
  render();
}
async function analyzeAll(){
  if(state.analyzingAll){state.analyzeAllAbort=true;return;}
  state.analyzingAll=true;state.analyzeAllAbort=false;render();
  var coins=filteredCoins().filter(function(c){var ch=state.analysisCache[c.symbol];return!ch||ch.status==='error';});
  for(var i=0;i<coins.length;i++){if(state.analyzeAllAbort)break;await analyzeCoin(coins[i]);if(i<coins.length-1)await sleep(ANALYZE_DELAY_MS);}
  state.analyzingAll=false;state.analyzeAllAbort=false;render();
}

// ── NATR ──────────────────────────────────────────────────────────────────
function calculateNATR(candles){
  if(candles.length<15)return null;
  var trs=[];
  for(var i=1;i<candles.length;i++){var h=candles[i].high,l=candles[i].low,pc=candles[i-1].close;trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}
  var last14=trs.slice(-14);
  var atr=last14.reduce(function(s,v){return s+v;},0)/14;
  var close=candles[candles.length-1].close;
  return close>0?(atr/close*100):null;
}
function natrCell(symbol){
  var nd=state.natrData[symbol];
  if(!nd||nd==='loading')return'<td class="td-natr natr-dim">—</td>';
  if(nd==='error')return'<td class="td-natr natr-dim">—</td>';
  var v=nd.value,cls=v<0.5?'natr-low':v<1.2?'natr-mid':'natr-high';
  return'<td class="td-natr '+cls+'">'+v.toFixed(2)+'</td>';
}
async function fetchNATR(symbol){
  state.natrData[symbol]='loading';
  try{
    var res=await fetch('https://fapi.binance.com/fapi/v1/klines?symbol='+symbol.toUpperCase()+'USDT&interval=5m&limit=30');
    if(!res.ok)throw new Error();
    var data=await res.json();
    if(!Array.isArray(data)||data.length<15)throw new Error();
    var candles=data.map(function(k){return{high:parseFloat(k[2]),low:parseFloat(k[3]),close:parseFloat(k[4])};});
    var v=calculateNATR(candles);
    state.natrData[symbol]=v!==null?{value:v}:'error';
  }catch(e){state.natrData[symbol]='error';}
}
async function fetchAllNATR(coins){
  await Promise.all(coins.map(function(c){return fetchNATR(c.symbol);}));
  render();
}

// ── Chart ─────────────────────────────────────────────────────────────────
function toggleChart(symbol){
  if(state.chartPopup===symbol){state.chartPopup=null;render();return;}
  state.chartPopup=symbol;
  if(!state.chartData[symbol]){fetchChart(symbol);}else{render();}
}
async function fetchChart(symbol){
  state.chartData[symbol]={status:'loading',candles:[]};render();
  try{
    var res=await fetch('https://fapi.binance.com/fapi/v1/klines?symbol='+symbol.toUpperCase()+'USDT&interval=5m&limit=100');
    if(!res.ok)throw new Error('HTTP '+res.status);
    var data=await res.json();
    if(!Array.isArray(data)||!data.length)throw new Error('Нет данных');
    state.chartData[symbol]={status:'ok',candles:data.map(function(k){return{open:parseFloat(k[1]),high:parseFloat(k[2]),low:parseFloat(k[3]),close:parseFloat(k[4])};})};
  }catch(err){state.chartData[symbol]={status:'error',error:err.message};}
  render();
}
function renderChart(symbol){
  var cd=state.chartData[symbol];
  if(!cd)return'';
  if(cd.status==='loading')return'<div class="chart-loading"><span class="chart-spinner"></span>Загружаю свечи...</div>';
  if(cd.status==='error')return'<div class="chart-error">Нет данных Binance Futures</div>';
    return'<div class="chart-label">5m \xb7 Binance Futures \xb7 100 свечей</div>'+renderCandleSVG(cd.candles);
}
function renderCandleSVG(candles){
  if(!candles.length)return'';
  var W=600,H=220,PAD=2,n=candles.length,slotW=W/n,cW=Math.max(1,Math.floor(slotW)-1);
  var minP=Math.min.apply(null,candles.map(function(c){return c.low;}));
  var maxP=Math.max.apply(null,candles.map(function(c){return c.high;}));
  var range=maxP-minP||1;
  function py(p){return PAD+(1-(p-minP)/range)*(H-PAD*2);}
  var r='';
  candles.forEach(function(c,i){
    var x=i*slotW,cx=x+slotW/2,isUp=c.close>=c.open,col=isUp?'#4ade80':'#f87171';
    var bT=Math.min(py(c.open),py(c.close)),bH=Math.max(1,Math.abs(py(c.open)-py(c.close)));
    r+='<line x1="'+cx.toFixed(1)+'" y1="'+py(c.high).toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+py(c.low).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
    r+='<rect x="'+x.toFixed(1)+'" y="'+bT.toFixed(1)+'" width="'+cW+'" height="'+bH.toFixed(1)+'" fill="'+col+'"/>';
  });
  return'<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:220px;display:block;">'+r+'</svg>';
}

// ── Render ─────────────────────────────────────────────────────────────────
function signalLabel(s){return s==='bullish'?'↑ Bullish':s==='caution'?'⚠ Caution':'— Neutral';}

function renderCoinRow(coin){
  var change=coin.price_change_percentage_24h||0;
  var cache=state.analysisCache[coin.symbol];
  var hasA=cache&&cache.status==='ok',isL=cache&&cache.status==='loading',isE=cache&&cache.status==='error';
  var signal=hasA?cache.result.signal:null,isOpen=state.openDrilldowns.has(coin.symbol);
  var chartBtn='<button class="btn-chart-row" onclick="event.stopPropagation();toggleChart(\''+coin.symbol+'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></button>';
  var ac='';
  if(isL)ac='<span class="spinner"></span>';
  else if(isE)ac='<span style="font-size:12px;color:var(--bloom-deep);font-weight:600;">Ошибка</span><button class="btn-retry" style="margin-left:8px" onclick="event.stopPropagation();analyzeCoinBySymbol(\''+coin.symbol+'\')">Повтор</button>';
  else if(hasA)ac='<span class="signal-badge '+signal+'">'+signalLabel(signal)+'</span><i class="chevron">'+(isOpen?'▲':'▼')+'</i>';
  else ac='<button class="btn-analyze-one" onclick="event.stopPropagation();analyzeAndOpen(\''+coin.symbol+'\')">Анализ</button>';
  var rc=(hasA||isE)?'clickable':'',ro=(hasA||isE)?'onclick="toggleDrilldown(\''+coin.symbol+'\')"':'';
  var row='<tr class="coin-row'+(signal?' '+signal:'')+' '+rc+'" '+ro+'>'+
    '<td class="td-name"><span class="coin-name">'+escHtml(coin.name)+'</span><span class="coin-symbol">'+coin.symbol.toUpperCase()+'</span></td>'+
    '<td class="td-num">'+fmtPrice(coin.current_price)+'</td>'+
    '<td class="td-change">+'+change.toFixed(2)+'%</td>'+
    natrCell(coin.symbol)+
    '<td class="td-num">'+fmt(coin.total_volume)+'</td>'+
    '<td class="td-action">'+chartBtn+ac+'</td></tr>';
  return row+((isOpen||isL)?renderDrilldown(coin,cache):'');
}

function renderDrilldown(coin,cache){
  if(!cache)return'';
  var content='';
  if(cache.status==='loading')content='<div class="dd-loading"><span class="spinner"></span>Анализирую...</div>';
  else if(cache.status==='error')content='<div class="dd-error">Ошибка: '+escHtml(cache.error)+'</div>';
  else if(cache.status==='ok'){
    var r=cache.result;
    var newsHtml='';
    if(r.news_summary){newsHtml='<div class="analysis-row"><strong>Новости:</strong> '+escHtml(r.news_summary)+'</div>';}
    content='<div class="dd-content">'+
      '<div class="dd-signal"><span class="signal-badge '+r.signal+'">'+signalLabel(r.signal)+'</span></div>'+
      '<div class="dd-text">'+
        '<div class="analysis-row"><strong>Катализатор:</strong> '+escHtml(r.catalyst)+'</div>'+
        '<div class="analysis-row"><strong>Анализ:</strong> '+escHtml(r.reasoning)+'</div>'+
        newsHtml+
      '</div></div>';
  }
  return'<tr class="drilldown-row"><td colspan="6">'+content+'</td></tr>';
}

function sortArrow(col){
  if(state.sortCol!==col)return'';
  return state.sortDir==='desc'?' ▾':' ▴';
}

function renderCoinsTable(coins){
  if(!coins.length)return'<div class="table-wrap"><div class="table-card"><div class="empty-state">Нет монет, соответствующих фильтру.</div></div></div>';
  return'<div class="table-wrap"><div class="table-card"><table class="coins-table">'+
    '<thead><tr>'+
      '<th onclick="setSort(\'symbol\')" style="cursor:pointer">Монета'+sortArrow('symbol')+'</th>'+
      '<th onclick="setSort(\'current_price\')" style="cursor:pointer">Цена'+sortArrow('current_price')+'</th>'+
      '<th onclick="setSort(\'price_change_percentage_24h\')" style="cursor:pointer">24ч'+sortArrow('price_change_percentage_24h')+'</th>'+
      '<th>NATR 5m</th>'+
      '<th onclick="setSort(\'total_volume\')" style="cursor:pointer">Объём'+sortArrow('total_volume')+'</th>'+
      '<th class="th-right"></th>'+
    '</tr></thead>'+
    '<tbody>'+coins.map(renderCoinRow).join('')+'</tbody></table></div></div>';
}

function render(){
  var app=document.getElementById('app');
  if(state.loading){app.innerHTML='<div class="loading-overlay"><div class="big-spinner"></div><p>Загружаю данные с Binance Futures...</p></div>';return;}
  var coins=filteredCoins();
  var bc=coins.filter(function(c){return state.analysisCache[c.symbol]&&state.analysisCache[c.symbol].result&&state.analysisCache[c.symbol].result.signal==='bullish';}).length;
  var avg=coins.length?(coins.reduce(function(s,c){return s+(c.price_change_percentage_24h||0);},0)/coins.length).toFixed(2):'—';
  var mv=coins.length?Math.max.apply(null,coins.map(function(c){return c.total_volume||0;})):0;
  app.innerHTML=
    '<div class="topbar"><div class="filters">'+
      '<div class="filter-group"><label>Объём:</label>'+
        [50,100,200].map(function(v){return'<button class="filter-pill'+(state.minVolume===v?' active':'')+'" onclick="state.minVolume='+v+';render()">'+v+'M</button>';}).join('')+
      '</div>'+
      '<div class="filter-group"><label>Рост:</label>'+
        [1,2,5,10].map(function(v){return'<button class="filter-pill'+(state.minChange===v?' active':'')+'" onclick="state.minChange='+v+';render()">'+v+'%</button>';}).join('')+
      '</div>'+
      '<div class="filters-right">'+
        (state.lastUpdate?'<span class="last-update">Обновлено: '+state.lastUpdate.toLocaleTimeString('ru-RU')+'</span>':'')+
        '<button class="btn-refresh" onclick="refreshCoins()">Обновить</button>'+
        '<button class="btn-analyze-all" onclick="analyzeAll()">'+(state.analyzingAll?'Остановить':'Анализировать все')+'</button>'+
      '</div></div></div>'+
    (state.error?'<div class="error-banner">⚠ '+escHtml(state.error)+'</div>':'')+
    '<div class="metrics">'+
      '<div class="metric-card"><div class="label">Монет в фильтре</div><div class="value">'+coins.length+'</div></div>'+
      '<div class="metric-card"><div class="label">Средний рост 24ч</div><div class="value green">+'+avg+'%</div></div>'+
      '<div class="metric-card"><div class="label">Макс. объём</div><div class="value blue">'+fmt(mv)+'</div></div>'+
      '<div class="metric-card"><div class="label">Bullish сигналов</div><div class="value green">'+bc+'</div></div>'+
    '</div>'+renderCoinsTable(coins)+renderPopup();
}

function renderPopup(){
  if(!state.chartPopup)return'';
  var s=state.chartPopup;
  var cd=state.chartData[s];
  return'<div class="popup-overlay" onclick="closePopup(event)"><div class="popup-content" onclick="event.stopPropagation()">'+
    '<div class="popup-header"><span class="popup-title">'+s.toUpperCase()+' 5m</span><button class="popup-close" onclick="closePopup()">&#x2715;</button></div>'+
    '<div class="popup-body">'+(cd?renderChart(s):'<div class="chart-loading"><span class="chart-spinner"></span>Загружаю свечи...</div>')+'</div></div></div>';
}
function closePopup(e){if(!e||e.target.classList.contains('popup-overlay')){state.chartPopup=null;render();}}

function analyzeCoinBySymbol(symbol){var c=state.coins.find(function(x){return x.symbol===symbol;});if(c)analyzeCoin(c);}
function analyzeAndOpen(symbol){state.openDrilldowns.add(symbol);var c=state.coins.find(function(x){return x.symbol===symbol;});if(c)analyzeCoin(c);}
function toggleDrilldown(symbol){if(state.openDrilldowns.has(symbol)){state.openDrilldowns.delete(symbol);}else{state.openDrilldowns.add(symbol);}render();}

fetchCoins();
</script>
</body>
</html>
