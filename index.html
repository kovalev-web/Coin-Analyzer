<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Altcoin Pump Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --canvas:#ffffff;--paper:#ffffff;--cloud:#f7f7f7;--fog:#e8e8e8;--steel:#c2c2c2;--hairline:#e8e8e8;
      --ink:#1a1a1a;--ink-deep:#000000;--on-ink:#ffffff;--charcoal:#3d3d3d;--graphite:#636363;
      --primary:#024ad8;--primary-bright:#296ef9;--primary-deep:#0e3191;--primary-soft:#c9e0fc;
      --bloom-coral:#ff5050;--bloom-deep:#b3262b;
      --bullish:#16a34a;--bullish-bg:#f0fdf4;--caution:#b45309;--caution-bg:#fffbeb;--neutral-bar:#c2c2c2;
      --shadow-soft:0 2px 8px rgba(26,26,26,0.08);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
    body{font-family:'Manrope',Arial,sans-serif;background:var(--cloud);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;}
    #app{max-width:1900px;margin:0 auto;}
    .last-update{font-size:12px;color:var(--graphite);font-weight:500;white-space:nowrap;}
    button{cursor:pointer;border:none;border-radius:4px;font-family:'Manrope',Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;padding:0 20px;height:40px;transition:opacity 0.15s;white-space:nowrap;}
    button:hover{opacity:0.85;}
    button:disabled{opacity:0.4;cursor:not-allowed;}
    .btn-refresh{background:var(--canvas);color:var(--ink);border:1px solid var(--ink);text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;}

    .topbar{background:var(--paper);border-radius:16px;box-shadow:var(--shadow-soft);margin:20px 32px 0;overflow:hidden;}
    .filters{padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .filters-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
    .filter-group{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--charcoal);font-weight:500;}
    .filter-group label{white-space:nowrap;}
    .filter-pill{background:var(--canvas);color:var(--charcoal);border:1px solid var(--steel);padding:0 12px;height:32px;font-size:12px;font-weight:600;border-radius:9999px;text-transform:none;letter-spacing:0;cursor:pointer;font-family:'Manrope',Arial,sans-serif;}
    .filter-pill:hover{opacity:0.8;}
    .filter-pill.active{background:var(--ink);color:var(--on-ink);border-color:var(--ink);}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:24px 32px 0;}
    .metric-card{background:var(--paper);border-radius:16px;padding:20px 24px;box-shadow:var(--shadow-soft);}
    .metric-card .label{font-size:10px;color:var(--graphite);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px;}
    .metric-card .value{font-size:26px;font-weight:700;color:var(--ink);line-height:1.0;}
    .metric-card .value.blue{color:var(--primary);}
    .metric-card .value.green{color:var(--bullish);}

    /* ── Cards ── */
    .cards-area{padding:16px 32px 64px;}
    .cards-sort{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
    .cards-sort span{font-size:11px;color:var(--graphite);font-weight:700;text-transform:uppercase;letter-spacing:0.8px;}
    .sort-pill{background:var(--canvas);color:var(--charcoal);border:1px solid var(--steel);padding:0 14px;height:28px;font-size:11px;font-weight:600;border-radius:9999px;text-transform:none;letter-spacing:0;}
    .sort-pill.active{background:var(--ink);color:var(--on-ink);border-color:var(--ink);}
    .cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
    @media(max-width:1200px){.cards-grid{grid-template-columns:repeat(2,1fr);}}
    .coin-card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow-soft);overflow:hidden;display:flex;flex-direction:column;}
    .card-head{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
    .card-sym{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:0.4px;white-space:nowrap;}
    .card-head-left{display:flex;align-items:center;gap:10px;min-width:0;}
    .card-inline-stats{display:flex;align-items:center;gap:0;}
    .card-inline-stats .stat-val{font-size:12px;font-weight:700;color:var(--ink);cursor:default;padding:0 7px;border-left:1px solid var(--hairline);}
    .stat-val{font-size:12px;font-weight:700;color:var(--ink);cursor:default;}
    .stat-val.up{color:var(--bullish);}
    .stat-val.dn{color:var(--bloom-deep);}
    .stat-val.warn{color:var(--caution);}
    .stat-val.dim{color:var(--steel);}
    .chart-container{height:300px;flex-shrink:0;background:var(--canvas);position:relative;}
    .card-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative;}
    .tf-picker{position:relative;display:inline-block;}
    .tf-pill{background:var(--ink);color:var(--on-ink);border:none;border-radius:9999px;padding:0 12px;height:26px;font-size:11px;font-weight:700;font-family:'Manrope',Arial,sans-serif;cursor:pointer;letter-spacing:0;text-transform:none;}
    .tf-pill:hover{opacity:0.8;}
    .tf-dd{position:absolute;top:calc(100% + 6px);right:0;background:var(--paper);border:1px solid var(--hairline);border-radius:8px;box-shadow:0 8px 24px rgba(26,26,26,0.12);overflow:hidden;z-index:200;min-width:64px;}
    .tf-dd button{display:block;width:100%;text-align:left;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink);background:transparent;border:none;border-radius:0;height:auto;letter-spacing:0;text-transform:none;}
    .tf-dd button:hover{background:var(--cloud);opacity:1;}
    .tf-dd button.active{color:var(--primary);font-weight:700;}
    .btn-analyze-one,.btn-retry,.btn-pressed{width:90px;text-align:center;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;height:26px;}
    .btn-pressed{background:var(--cloud);border:1px solid var(--steel);border-radius:4px;color:var(--graphite);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;cursor:default;opacity:0.6;}
    .btn-retry{background:#fff1f1;color:var(--bloom-deep);border:1px solid #fca5a5;font-size:11px;padding:0 10px;height:26px;border-radius:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;}
    .analysis-overlay{position:fixed;z-index:9999;background:var(--paper);border:1px solid var(--hairline);border-radius:16px;padding:20px 24px;box-shadow:0 8px 24px rgba(26,26,26,0.12);min-width:260px;max-width:380px;max-height:60vh;overflow-y:auto;font-size:14px;line-height:1.55;color:var(--charcoal);}
    .ao-spinner{display:flex;align-items:center;justify-content:center;padding:32px 24px;}
    .ao-content{display:none;}
    .ao-content.show{display:block;}
    .ao-row{margin-bottom:8px;}
    .ao-row:last-child{margin-bottom:0;}
    .ao-row strong{color:var(--ink);font-weight:700;}
    .ao-err{font-size:13px;color:var(--bloom-deep);font-weight:600;}
    .ao-reanalyze{display:block;width:100%;margin-top:16px;padding:0 20px;height:40px;font-size:13px;font-weight:700;background:var(--primary);color:var(--on-ink);border:none;border-radius:4px;letter-spacing:0.7px;text-transform:uppercase;cursor:pointer;font-family:'Manrope',Arial,sans-serif;}
    .ao-reanalyze:hover{opacity:0.85;}
    @media(max-width:768px){.analysis-overlay{min-width:200px;max-width:calc(100vw - 24px);max-height:50vh;padding:14px 16px;}}

    /* ── Signal badge ── */
    .signal-badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
    .signal-badge.bullish{background:var(--bullish-bg);color:var(--bullish);}
    .signal-badge.caution{background:var(--caution-bg);color:var(--caution);}
    .signal-badge.neutral{background:var(--fog);color:var(--graphite);}

    /* ── Spinner / states ── */
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--fog);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 64px);background:var(--cloud);}
    .loading-overlay .big-spinner{width:40px;height:40px;border:3px solid var(--fog);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;}
    .loading-overlay p{font-size:14px;font-weight:600;color:var(--charcoal);}
    .error-banner{margin:16px 32px 0;background:#fff1f1;border:1px solid #fca5a5;border-radius:8px;padding:12px 16px;color:var(--bloom-deep);font-size:13px;font-weight:600;}
    .empty-state{text-align:center;padding:64px 24px;color:var(--graphite);font-size:14px;font-weight:600;}

    @media(max-width:768px){
      .topbar{margin:12px 12px 0;border-radius:12px;}
      .filters{padding:10px 14px;gap:12px;flex-direction:column;align-items:stretch;}
      .filters-right{margin-left:0;}
      .btn-refresh{display:none;}
      .metrics{padding:12px 12px 0;gap:8px;grid-template-columns:repeat(2,1fr);}
      .metric-card:nth-child(2),.metric-card:nth-child(4){display:none;}
      .metric-card{padding:12px 14px;border-radius:12px;}
      .metric-card .value{font-size:20px;}
      .cards-area{padding:8px 12px 32px;}
      .cards-grid{grid-template-columns:1fr;}
      .error-banner{margin:12px 12px 0;}
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
var STABLE_SYMBOLS=new Set(['usdt','usdc','busd','dai','tusd','usdp','gusd','frax','lusd','usdd','pyusd']);
var CACHE_TTL_MS=2*60*1000,ANALYZE_DELAY_MS=400;

var _charts={},_series={},_volSeries={},_rulers={};
var state={
  coins:[],analysisCache:{},chartData:{},natrData:{},chartTF:{},
  lastUpdate:null,cacheExpires:0,loading:false,error:null,
  minVolume:100,minChange:1,sortCol:'price_change_percentage_24h',sortDir:'desc',
  analyzingAll:false,analyzeAllAbort:false,
};

function fmt(n){if(n==null)return'—';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(4);}
function fmtPrice(p){if(p==null)return'—';if(p>=1)return'$'+p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(p>=0.01)return'$'+p.toFixed(4);return'$'+p.toFixed(8);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function escHtml(s){if(typeof s!=='string')return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function setSort(col){
  if(state.sortCol===col){state.sortDir=state.sortDir==='asc'?'desc':'asc';}
  else{state.sortCol=col;state.sortDir='desc';}
  render();
}

function filteredCoins(){
  var minVol=(state.minVolume||0)*1e6,minChg=state.minChange||0;
  var coins=state.coins.filter(function(c){return !STABLE_SYMBOLS.has(c.symbol.toLowerCase())&&(c.total_volume||0)>=minVol&&(c.price_change_percentage_24h||0)>=minChg;});
  coins=[].concat(coins).sort(function(a,b){
    var va=a[state.sortCol],vb=b[state.sortCol];
    if(typeof va==='string')return state.sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    return state.sortDir==='asc'?(va||0)-(vb||0):(vb||0)-(va||0);
  });
  return coins;
}

async function fetchCoins(){
  var now=Date.now();
  if(state.coins.length>0&&now<state.cacheExpires)return;
  state.loading=true;state.error=null;render();
  try{
    var res=await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
    if(!res.ok)throw new Error('Binance HTTP '+res.status);
    var data=await res.json();
    state.coins=data.filter(function(t){return t.symbol.endsWith('USDT')&&!STABLE_SYMBOLS.has(t.symbol.replace('USDT','').toLowerCase())&&t.symbol!=='USDTUSDT';}).map(function(t){
      var sym=t.symbol.replace('USDT','').toLowerCase();
      return{symbol:sym,name:sym.toUpperCase(),current_price:parseFloat(t.lastPrice),total_volume:Math.round(parseFloat(t.quoteVolume)),price_change_percentage_24h:parseFloat(t.priceChangePercent)};
    }).sort(function(a,b){return b.total_volume-a.total_volume;});
    state.lastUpdate=new Date();
    state.cacheExpires=now+CACHE_TTL_MS;
    fetchAllNATR(filteredCoins());
  }catch(err){state.error='Ошибка загрузки Binance Futures: '+err.message;}
  state.loading=false;render();
}
async function refreshCoins(){state.cacheExpires=0;await fetchCoins();}

function saveCache(){
  var obj={};
  Object.keys(state.analysisCache).forEach(function(k){
    var e=state.analysisCache[k];
    if(e.status==='ok'&&e.result)obj[k]={status:'ok',result:e.result,timestamp:Date.now()};
  });
  try{localStorage.setItem('pa_cache',JSON.stringify(obj));}catch(e){}
}
function loadCache(){
  try{
    var d=localStorage.getItem('pa_cache');
    if(!d)return;
    var obj=JSON.parse(d),now=Date.now();
    Object.keys(obj).forEach(function(k){if(now-obj[k].timestamp>86400000)delete obj[k];});
    Object.assign(state.analysisCache,obj);
  }catch(e){}
}

async function analyzeCoin(coin){
  var key=coin.symbol;
  state.analysisCache[key]={status:'loading',result:null};render();
  var nd=state.natrData[coin.symbol];
  var natrVal=nd&&nd!=='loading'&&nd!=='error'?nd.value:null;
  try{
    var res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:coin.name,symbol:coin.symbol.toUpperCase(),
        change24h:(coin.price_change_percentage_24h||0).toFixed(2),
        volume:Math.round(coin.total_volume||0),price:coin.current_price||0,natr:natrVal})});
    var json=await res.json();
    state.analysisCache[key]=(!res.ok||json.error)?{status:'error',result:null,error:json.error||'Ошибка сервера'}:{status:'ok',result:json};
  }catch(err){state.analysisCache[key]={status:'error',result:null,error:'Сетевая ошибка: '+err.message};}
  render();
  saveCache();
  updateAnalysisPopup(key);
}

function updateAnalysisPopup(sym){
  var popup=document.getElementById('analysis-overlay');
  if(!popup||popup.style.display!=='block'||popup.dataset.sym!==sym)return;
  var cache=state.analysisCache[sym];
  var content=popup.querySelector('.ao-content');
  var spinner=popup.querySelector('.ao-spinner');
  if(!cache||cache.status==='loading')return;
  spinner.style.display='none';
  content.style.display='block';
  if(cache.status==='ok'&&cache.result){
    var r=cache.result;
    content.innerHTML='<div class="ao-row"><strong>Катализатор:</strong> '+escHtml(r.catalyst)+'</div>'+
      (r.news_summary?'<div class="ao-row"><strong>Новости:</strong> '+escHtml(r.news_summary)+'</div>':'')+
      '<button class="ao-reanalyze" onclick="reanalyzeCoin(\''+sym+'\')">Повторный анализ</button>';
  }else{
    content.innerHTML='<div class="ao-err">'+(cache.error||'Ошибка')+'</div>'+
      '<button class="ao-reanalyze" onclick="reanalyzeCoin(\''+sym+'\')">Повторный анализ</button>';
  }
}

function reanalyzeCoin(sym){
  delete state.analysisCache[sym];
  var popup=document.getElementById('analysis-overlay');
  if(popup){
    popup.querySelector('.ao-spinner').style.display='flex';
    popup.querySelector('.ao-content').style.display='none';
  }
  analyzeCoinBySymbol(sym);
}
async function analyzeAll(){
  if(state.analyzingAll){state.analyzeAllAbort=true;return;}
  state.analyzingAll=true;state.analyzeAllAbort=false;render();
  var coins=filteredCoins().filter(function(c){var ch=state.analysisCache[c.symbol];return!ch||ch.status==='error';});
  for(var i=0;i<coins.length;i++){if(state.analyzeAllAbort)break;await analyzeCoin(coins[i]);if(i<coins.length-1)await sleep(ANALYZE_DELAY_MS);}
  state.analyzingAll=false;state.analyzeAllAbort=false;render();
}
function analyzeCoinBySymbol(symbol){var c=state.coins.find(function(x){return x.symbol===symbol;});if(c)analyzeCoin(c);}

function getOverlay(){
  var el=document.getElementById('analysis-overlay');
  if(!el){
    el=document.createElement('div');
    el.id='analysis-overlay';
    el.className='analysis-overlay';
    el.innerHTML='<div class="ao-spinner"><span class="spinner"></span></div><div class="ao-content"></div>';
    document.body.appendChild(el);
  }
  return el;
}

function openAnalysisPopup(sym,btn){
  var popup=getOverlay();
  var cache=state.analysisCache[sym];
  var spinner=popup.querySelector('.ao-spinner');
  var content=popup.querySelector('.ao-content');
  spinner.style.display='flex';
  content.style.display='none';
  popup.style.display='block';
  popup.dataset.sym=sym;
  var rect=btn.getBoundingClientRect();
  var top=rect.bottom+8,left=rect.left;
  if(left+360>window.innerWidth)left=Math.max(8,window.innerWidth-370);
  if(top+300>window.innerHeight)top=Math.max(8,rect.top-260);
  popup.style.top=top+'px';popup.style.left=left+'px';
  if(cache&&cache.status==='loading')return;
  if(cache&&(cache.status==='ok'||cache.status==='error')){updateAnalysisPopup(sym);return;}
  analyzeCoinBySymbol(sym);
}

function toggleTFPicker(sym,e){
  e.stopPropagation();
  var dd=document.getElementById('tfd-'+sym);
  if(!dd)return;
  var isOpen=dd.style.display!=='none';
  document.querySelectorAll('.tf-dd').forEach(function(el){el.style.display='none';});
  if(!isOpen)dd.style.display='block';
}
function pickTF(sym,tf,e){
  e.stopPropagation();
  document.querySelectorAll('.tf-dd').forEach(function(el){el.style.display='none';});
  var pill=document.querySelector('[data-tfbtn="'+sym+'"]');
  if(pill)pill.textContent=tf;
  var dd=document.getElementById('tfd-'+sym);
  if(dd)dd.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b.textContent===tf);});
  setChartTF(sym,tf);
}

document.addEventListener('click',function(e){
  var popup=document.getElementById('analysis-overlay');
  if(popup&&popup.style.display==='block'&&!popup.contains(e.target)&&!e.target.closest('[data-ck]'))popup.style.display='none';
  if(!e.target.closest('.tf-picker'))document.querySelectorAll('.tf-dd').forEach(function(el){el.style.display='none';});
});

// ── NATR ──────────────────────────────────────────────────────────────────
function calculateNATR(candles){
  if(candles.length<15)return null;
  var trs=[];
  for(var i=1;i<candles.length;i++){var h=candles[i].high,l=candles[i].low,pc=candles[i-1].close;trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}
  var last14=trs.slice(-14);
  var atr=last14.reduce(function(s,v){return s+v;},0)/14;
  var close=candles[candles.length-1].close;
  return close>0?(atr/close*100):null;
}
async function fetchNATR(symbol){
  state.natrData[symbol]='loading';
  try{
    var res=await fetch('https://fapi.binance.com/fapi/v1/klines?symbol='+symbol.toUpperCase()+'USDT&interval=5m&limit=30');
    if(!res.ok)throw new Error();
    var data=await res.json();
    if(!Array.isArray(data)||data.length<15)throw new Error();
    var candles=data.map(function(k){return{high:parseFloat(k[2]),low:parseFloat(k[3]),close:parseFloat(k[4])};});
    var v=calculateNATR(candles);
    state.natrData[symbol]=v!==null?{value:v}:'error';
  }catch(e){state.natrData[symbol]='error';}
}
async function fetchAllNATR(coins){
  await Promise.all(coins.map(function(c){return fetchNATR(c.symbol);}));
  render();
}

// ── Live price updates (REST polling) ─────────────────────────────────────
var _pollTimer=null;

function applyLivePriceUpdates(){
  document.querySelectorAll('[data-sym]').forEach(function(el){
    var sym=el.dataset.sym;
    var coin=state.coins.find(function(c){return c.symbol===sym;});
    if(!coin)return;
    var spans=el.querySelectorAll('.card-inline-stats .stat-val');
    if(spans.length<3)return;
    var ch=coin.price_change_percentage_24h||0;
    var newChg=(ch>=0?'+':'')+ch.toFixed(2)+'%';
    if(spans[0].textContent!==newChg){spans[0].textContent=newChg;spans[0].className='stat-val '+(ch>=0?'up':'dn');}
    var nd=state.natrData[sym];
    if(nd&&nd!=='loading'&&nd!=='error'){
      var v=nd.value;
      var newNat=v.toFixed(2);
      if(spans[1].textContent!==newNat){spans[1].textContent=newNat;spans[1].className='stat-val '+(v<0.5?'up':v<1.2?'warn':'dn');}
    }
    var newVol=fmt(Math.round(coin.total_volume||0));
    if(spans[2].textContent!==newVol)spans[2].textContent=newVol;
  });
}

async function pollPrices(){
  try{
    var res=await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
    if(!res.ok)return;
    var arr=await res.json();
    var newCoins=0;
    arr.forEach(function(t){
      var sym=t.symbol.replace('USDT','').toLowerCase();
      var coin=state.coins.find(function(c){return c.symbol===sym;});
      if(!coin){
        if(!t.symbol.endsWith('USDT')||STABLE_SYMBOLS.has(sym)||sym==='usdt')return;
        var qv=Math.round(parseFloat(t.quoteVolume));
        var pc=parseFloat(t.priceChangePercent);
        if(qv<((state.minVolume||0)*1e6)||pc<(state.minChange||0))return;
        state.coins.push({symbol:sym,name:sym.toUpperCase(),current_price:parseFloat(t.lastPrice),total_volume:qv,price_change_percentage_24h:pc});
        newCoins++;
        return;
      }
      coin.current_price=parseFloat(t.lastPrice);
      coin.price_change_percentage_24h=parseFloat(t.priceChangePercent);
      coin.total_volume=Math.round(parseFloat(t.quoteVolume));
    });
    if(newCoins){render();return;}
    applyLivePriceUpdates();
  }catch(e){}
}

async function pollCharts(){
  var coins=filteredCoins();
  for(var i=0;i<coins.length;i++){
    var c=coins[i],tf=state.chartTF[c.symbol]||'5m',key=c.symbol+'_'+tf;
    var cd=state.chartData[key];
    if(!cd||cd.status!=='ok')continue;
    var s=_series[c.symbol];
    if(!s)continue;
    try{
      var res=await fetch('https://fapi.binance.com/fapi/v1/klines?symbol='+c.symbol.toUpperCase()+'USDT&interval='+tf+'&limit=2');
      if(!res.ok)continue;
      var data=await res.json();
      if(!Array.isArray(data)||!data.length)continue;
      var k=data[data.length-1];
      var newCandle={time:Math.floor(parseInt(k[0])/1000),open:parseFloat(k[1]),high:parseFloat(k[2]),low:parseFloat(k[3]),close:parseFloat(k[4]),volume:parseFloat(k[5])};
      var arr=cd.candles,last=arr[arr.length-1];
      if(last&&last.time===newCandle.time){arr[arr.length-1]=newCandle;}
      else if(!last||newCandle.time>last.time){arr.push(newCandle);if(arr.length>200)arr.shift();}
      s.update(newCandle);
      var vs=_volSeries[c.symbol];
      if(vs)vs.update({time:newCandle.time,value:newCandle.volume,color:newCandle.close>=newCandle.open?'rgba(26,26,26,0.35)':'rgba(153,153,153,0.35)'});
    }catch(e){}
  }
}

function startPricePolling(){
  if(_pollTimer)clearInterval(_pollTimer);
  _pollTimer=setInterval(function(){pollPrices();pollCharts();},3000);
}


function destroyCharts(){
  Object.keys(_charts).forEach(function(sym){try{_charts[sym].remove();}catch(e){}});
  _charts={};_series={};_volSeries={};_rulers={};
}

function updateChart(symbol){
  var s=_series[symbol],chart=_charts[symbol];
  if(!s||!chart)return;
  var tf=state.chartTF[symbol]||'5m';
  var cd=state.chartData[symbol+'_'+tf];
  if(!cd||cd.status!=='ok'||!cd.candles.length)return;
  s.setData(cd.candles);
  var vs=_volSeries[symbol];
  if(vs)vs.setData(cd.candles.map(function(c){
    return{time:c.time,value:c.volume||0,color:c.close>=c.open?'rgba(26,26,26,0.35)':'rgba(153,153,153,0.35)'};
  }));
  chart.timeScale().fitContent();
}

async function fetchChart(symbol,tf){
  tf=tf||state.chartTF[symbol]||'5m';
  var key=symbol+'_'+tf;
  if(state.chartData[key]&&state.chartData[key].status==='ok'){updateChart(symbol);return;}
  try{
    var res=await fetch('https://fapi.binance.com/fapi/v1/klines?symbol='+symbol.toUpperCase()+'USDT&interval='+tf+'&limit=100');
    if(!res.ok)throw new Error('HTTP '+res.status);
    var data=await res.json();
    if(!Array.isArray(data)||!data.length)throw new Error('No data');
    state.chartData[key]={status:'ok',candles:data.map(function(k){return{time:Math.floor(parseInt(k[0])/1000),open:parseFloat(k[1]),high:parseFloat(k[2]),low:parseFloat(k[3]),close:parseFloat(k[4]),volume:parseFloat(k[5])};})};
  }catch(err){state.chartData[key]={status:'error',error:err.message};}
  updateChart(symbol);
}

function getChartOpts(width){
  return{width:width,height:300,
    layout:{background:{color:'#ffffff'},textColor:'#636363'},
    grid:{vertLines:{color:'#e8e8e8'},horzLines:{color:'#e8e8e8'}},
    crosshair:{mode:1},
    rightPriceScale:{visible:true,borderColor:'#e8e8e8',scaleMargins:{top:0.05,bottom:0.25}},
    timeScale:{borderColor:'#e8e8e8',timeVisible:true,secondsVisible:false},
    handleScroll:true,handleScale:true};
}

function setChartTF(symbol,tf){
  state.chartTF[symbol]=tf;
  var sel=document.querySelector('[data-tfsym="'+symbol+'"]');
  if(sel)sel.value=tf;
  clearRuler(symbol);
  fetchChart(symbol,tf);
}

function drawRuler(sym,p1,p2,pr1,pr2){
  var ruler=_rulers[sym];if(!ruler||!ruler.canvas)return;
  var rc=ruler.canvas,ctx=rc.getContext('2d');
  ctx.clearRect(0,0,rc.width,rc.height);
  if(!p1||!p2||pr1==null||pr2==null)return;
  var isUp=pr2>=pr1,color=isUp?'#16a34a':'#dc2626';
  var pct=((pr2-pr1)/Math.abs(pr1)*100);
  var pctStr=(isUp?'+':'')+pct.toFixed(2)+'%';
  var chart=_charts[sym];
  if(chart){
    var t1=chart.timeScale().coordinateToTime(p1.x),t2=chart.timeScale().coordinateToTime(p2.x);
    if(t1!=null&&t2!=null){
      var d=Math.abs(t2-t1),dur=d<60?Math.round(d)+'с':d<3600?Math.round(d/60)+'м':d<86400?Math.floor(d/3600)+'ч '+Math.round((d%3600)/60)+'м':Math.floor(d/86400)+'д '+Math.floor((d%86400)/3600)+'ч';
      pctStr+='  \xb7  '+dur;
    }
  }
  ctx.fillStyle=isUp?'rgba(22,163,74,0.09)':'rgba(220,38,38,0.09)';
  ctx.fillRect(0,Math.min(p1.y,p2.y),rc.width,Math.abs(p2.y-p1.y)||1);
  ctx.strokeStyle=color;ctx.lineWidth=1;ctx.setLineDash([4,3]);
  ctx.beginPath();
  ctx.moveTo(0,p1.y);ctx.lineTo(rc.width,p1.y);
  ctx.moveTo(0,p2.y);ctx.lineTo(rc.width,p2.y);
  ctx.stroke();ctx.setLineDash([]);
  ctx.font='bold 16px Manrope,Arial,sans-serif';ctx.fillStyle=color;
  var lx=p2.x+12,ly=p2.y-10;
  if(lx+170>rc.width)lx=p2.x-175;if(lx<2)lx=2;
  if(ly<14)ly=p2.y+20;if(ly>rc.height-4)ly=rc.height-4;
  ctx.fillText(pctStr,lx,ly);
}
function clearRuler(sym){
  var ruler=_rulers[sym];if(!ruler)return;
  ruler.start=null;
  if(ruler.canvas){var ctx=ruler.canvas.getContext('2d');ctx.clearRect(0,0,ruler.canvas.width,ruler.canvas.height);}
}
function initCharts(){
  if(!window.LightweightCharts)return;
  filteredCoins().forEach(function(c){
    var el=document.getElementById('chart-'+c.symbol);
    if(!el)return;
    var chart=LightweightCharts.createChart(el,getChartOpts(el.offsetWidth||400));
    var s=chart.addCandlestickSeries({upColor:'#1a1a1a',downColor:'#999999',borderUpColor:'#1a1a1a',borderDownColor:'#999999',wickUpColor:'#1a1a1a',wickDownColor:'#999999'});
    var vs=chart.addHistogramSeries({color:'#94a3b8',priceFormat:{type:'volume'},priceScaleId:'volume',lastValueVisible:false,priceLineVisible:false});
    chart.priceScale('volume').applyOptions({scaleMargins:{top:0.82,bottom:0}});
    _charts[c.symbol]=chart;_series[c.symbol]=s;_volSeries[c.symbol]=vs;
    var rc=document.createElement('canvas');
    rc.style.cssText='position:absolute;top:0;left:0;pointer-events:none;z-index:5;';
    el.style.position='relative';el.appendChild(rc);
    rc.width=el.offsetWidth||400;rc.height=el.offsetHeight||300;
    _rulers[c.symbol]={start:null,canvas:rc};
    (function(sym,container,cs){
      container.addEventListener('mousedown',function(e){
        if(e.button!==1)return;
        e.preventDefault();
        var rect=container.getBoundingClientRect();
        var pt={x:e.clientX-rect.left,y:e.clientY-rect.top};
        var pr=cs.coordinateToPrice(pt.y);
        if(pr!=null)_rulers[sym].start={pt:pt,price:pr};
      },{capture:true});
      container.addEventListener('mousemove',function(e){
        var ruler=_rulers[sym];
        if(!ruler.start||!(e.buttons&4))return;
        var rect=container.getBoundingClientRect();
        var pt={x:e.clientX-rect.left,y:e.clientY-rect.top};
        drawRuler(sym,ruler.start.pt,pt,ruler.start.price,cs.coordinateToPrice(pt.y));
      });
      container.addEventListener('mouseup',function(e){if(e.button===1)clearRuler(sym);});
      container.addEventListener('mouseleave',function(){clearRuler(sym);});
      new ResizeObserver(function(){
        if(_charts[sym])_charts[sym].resize(container.offsetWidth,300);
        if(_rulers[sym]&&_rulers[sym].canvas){_rulers[sym].canvas.width=container.offsetWidth;_rulers[sym].canvas.height=container.offsetHeight;}
      }).observe(container);
    })(c.symbol,el,s);
    fetchChart(c.symbol,state.chartTF[c.symbol]||'5m');
  });
}

// ── Render ────────────────────────────────────────────────────────────────
function signalLabel(s){return s==='bullish'?'↑ Bullish':s==='caution'?'⚠ Caution':'— Neutral';}

function natrDisplay(symbol){
  var nd=state.natrData[symbol];
  if(!nd||nd==='loading'||nd==='error')return{val:'—',cls:'dim'};
  var v=nd.value,cls=v<0.5?'up':v<1.2?'warn':'dn';
  return{val:v.toFixed(2),cls:cls};
}

function renderCard(coin){
  var cache=state.analysisCache[coin.symbol];
  var hasA=cache&&cache.status==='ok',isL=cache&&cache.status==='loading',isE=cache&&cache.status==='error';
  var signal=hasA?cache.result.signal:null;
  var tf=state.chartTF[coin.symbol]||'5m';
  var change=coin.price_change_percentage_24h||0;
  var natr=natrDisplay(coin.symbol);

  var badge='';
  var ck='ck-'+coin.symbol;
  if(isL)badge='<span class="btn-pressed" data-ck="'+ck+'">Анализ</span>';
  else if(isE)badge='<button class="btn-retry" data-ck="'+ck+'" onclick="openAnalysisPopup(\''+coin.symbol+'\',this)">Повтор</button>';
  else if(hasA)badge='<span class="signal-badge '+signal+'" data-ck="'+ck+'" onclick="openAnalysisPopup(\''+coin.symbol+'\',this)">'+signalLabel(signal)+'</span>';
  else badge='<button class="btn-analyze-one" data-ck="'+ck+'" onclick="openAnalysisPopup(\''+coin.symbol+'\',this)">Анализ</button>';

  var tfPicker='<div class="tf-picker">'+
    '<button class="tf-pill" data-tfbtn="'+coin.symbol+'" onclick="toggleTFPicker(\''+coin.symbol+'\',event)">'+tf+'</button>'+
    '<div class="tf-dd" id="tfd-'+coin.symbol+'" style="display:none">'+
      ['5m','15m','1h','4h'].map(function(t){
        return'<button class="'+(t===tf?'active':'')+'" onclick="pickTF(\''+coin.symbol+'\',\''+t+'\',event)">'+t+'</button>';
      }).join('')+
    '</div>'+
  '</div>';

  return'<div class="coin-card'+(signal?' '+signal:'')+'" data-sym="'+coin.symbol+'">'+
    '<div class="card-head">'+
      '<div class="card-head-left">'+
        '<span class="card-sym">'+coin.symbol.toUpperCase()+'</span>'+
        '<div class="card-inline-stats">'+
          '<span class="stat-val '+(change>=0?'up':'dn')+'" title="Изменение за 24ч">'+(change>=0?'+':'')+change.toFixed(2)+'%</span>'+
          '<span class="stat-val '+natr.cls+'" title="NATR 5м (волатильность)">'+natr.val+'</span>'+
          '<span class="stat-val" title="Объём за 24ч">'+fmt(coin.total_volume)+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="card-head-right">'+
        tfPicker+
        badge+
      '</div>'+
    '</div>'+
    '<div class="chart-container" id="chart-'+coin.symbol+'"></div>'+
  '</div>';
}

function render(){
  var app=document.getElementById('app');
  if(state.loading){destroyCharts();app.innerHTML='<div class="loading-overlay"><div class="big-spinner"></div><p>Загружаю данные с Binance Futures...</p></div>';return;}
  var coins=filteredCoins();
  var bc=coins.filter(function(c){return state.analysisCache[c.symbol]&&state.analysisCache[c.symbol].result&&state.analysisCache[c.symbol].result.signal==='bullish';}).length;
  var maxRise=coins.length?Math.max.apply(null,coins.map(function(c){return c.price_change_percentage_24h||0;})).toFixed(2):'—';
  var mv=coins.length?Math.max.apply(null,coins.map(function(c){return c.total_volume||0;})):0;

  var sortBar='<div class="cards-sort"><span>Сортировка:</span>'+
    '<button class="sort-pill'+(state.sortCol==='price_change_percentage_24h'?' active':'')+'" onclick="setSort(\'price_change_percentage_24h\')">По росту</button>'+
    '<button class="sort-pill'+(state.sortCol==='total_volume'?' active':'')+'" onclick="setSort(\'total_volume\')">По объёму</button>'+
    '<button class="sort-pill'+(state.sortCol==='symbol'?' active':'')+'" onclick="setSort(\'symbol\')">По тикеру</button>'+
  '</div>';

  var cardsHtml=coins.length
    ?'<div class="cards-area">'+sortBar+'<div class="cards-grid">'+coins.map(renderCard).join('')+'</div></div>'
    :'<div class="empty-state">Нет монет, соответствующих фильтру.</div>';

  destroyCharts();
  app.innerHTML=
    '<div class="topbar"><div class="filters">'+
      '<div class="filter-group"><label>Объём:</label>'+
        [50,100,200].map(function(v){return'<button class="filter-pill'+(state.minVolume===v?' active':'')+'" onclick="state.minVolume='+v+';render()">'+v+'M</button>';}).join('')+
      '</div>'+
      '<div class="filter-group"><label>Рост:</label>'+
        [1,2,5,10].map(function(v){return'<button class="filter-pill'+(state.minChange===v?' active':'')+'" onclick="state.minChange='+v+';render()">'+v+'%</button>';}).join('')+
      '</div>'+
      '<div class="filters-right">'+
        (state.lastUpdate?'<span class="last-update">Обновлено: '+state.lastUpdate.toLocaleTimeString('ru-RU')+'</span>':'')+
        '<button class="btn-refresh" onclick="refreshCoins()">Обновить</button>'+
      '</div></div></div>'+
    (state.error?'<div class="error-banner">⚠ '+escHtml(state.error)+'</div>':'')+
    '<div class="metrics">'+
      '<div class="metric-card"><div class="label">Монет в фильтре</div><div class="value">'+coins.length+'</div></div>'+
      '<div class="metric-card"><div class="label">Максимальный рост</div><div class="value green">'+(maxRise>=0?'+':'')+maxRise+'%</div></div>'+
      '<div class="metric-card"><div class="label">Максимальный объем</div><div class="value blue">'+fmt(mv)+'</div></div>'+
      '<div class="metric-card"><div class="label">Bullish сигналов</div><div class="value green">'+bc+'</div></div>'+
    '</div>'+cardsHtml;

  initCharts();
}

loadCache();
fetchCoins();
startPricePolling();
</script>
</body>
