<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inplay Phase Detector</title>
  <style>
    body  { background: #0d0d0d; color: #e0e0e0; font-family: monospace; margin: 0; padding: 16px; }
    h2    { margin: 0 0 8px; font-size: 1rem; color: #aaa; }
    #status { font-size: 0.75rem; color: #666; margin-bottom: 10px; }

    /* ── shared table styles ── */
    table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
    th    { text-align: right; padding: 5px 10px; color: #777; border-bottom: 1px solid #333;
            cursor: pointer; user-select: none; white-space: nowrap; }
    th:first-child { text-align: left; }
    th:hover { color: #bbb; }
    th.sort-asc::after  { content: ' ▲'; color: #4caf50; }
    th.sort-desc::after { content: ' ▼'; color: #4caf50; }
    td    { text-align: right; padding: 4px 10px; border-bottom: 1px solid #1a1a1a; }
    td:first-child { text-align: left; color: #fff; font-weight: bold; }

    /* ── live table row colours ── */
    .row-long    { background: rgba(76, 175, 80, 0.08); }
    .row-short   { background: rgba(244, 67, 54, 0.08); }
    .row-cooling { background: rgba(80, 80, 80, 0.12); }
    .row-cooling td { color: #666; }
    .row-cooling td:first-child { color: #888; }

    /* ── history table row ── */
    .hist-row td { color: #999; }
    .hist-row td:first-child { color: #ccc; font-weight: normal; }
    .hist-row:hover td { background: rgba(255,255,255,0.03); }

    .long  { color: #4caf50; }
    .short { color: #f44336; }
    .muted { color: #555; }

    #empty { color: #555; font-size: 0.82rem; padding: 12px 0; }

    /* ── history section ── */
    .hist-header {
      display: flex; align-items: baseline; gap: 12px;
      margin: 28px 0 8px;
      border-top: 1px solid #222; padding-top: 16px;
    }
    .hist-header h3 { margin: 0; font-size: 0.9rem; color: #888; font-weight: normal; }
    #hist-count { font-size: 0.72rem; color: #555; }
    #clear-hist {
      margin-left: auto; font-size: 0.72rem; color: #555; background: none;
      border: 1px solid #333; border-radius: 3px; padding: 2px 8px;
      cursor: pointer; font-family: monospace;
    }
    #clear-hist:hover { color: #f44336; border-color: #f44336; }
  </style>
</head>
<body>
  <h2>Inplay — Phase Detector</h2>
  <div id="status">connecting…</div>

  <!-- Live table -->
  <table id="table" style="display:none">
    <thead>
      <tr>
        <th data-col="symbol">Symbol</th>
        <th data-col="phase_start_time">Phase Time</th>
        <th data-col="direction">Direction</th>
        <th data-col="rvol_last">RVOL_5m</th>
        <th data-col="rvol_avg">avg RVOL(3)</th>
        <th data-col="delta_price">Δp15m %</th>
        <th data-col="cvd_z">CVD_z</th>
        <th data-col="vol24h">24h Vol</th>
        <th data-col="status">Status</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" style="display:none">No coins in phase right now.</div>

  <!-- History table -->
  <div class="hist-header">
    <h3>Detected phases</h3>
    <span id="hist-count"></span>
    <button id="clear-hist">clear</button>
  </div>
  <table>
    <thead>
      <tr>
        <th style="text-align:left">Symbol</th>
        <th>Detected at</th>
        <th>Direction</th>
        <th>RVOL_5m</th>
        <th>avg RVOL(3)</th>
        <th>Δp15m %</th>
        <th>CVD_z</th>
        <th>24h Vol</th>
      </tr>
    </thead>
    <tbody id="hist-tbody"></tbody>
  </table>

  <script type="module" src="/src/inplay-phase.js"></script>
</body>
</html>
