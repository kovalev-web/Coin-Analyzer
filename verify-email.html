<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questtick — Подтверждение email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/auth.css" />
  <script>
    var params = window.location.search;
    if (params) {
      window.location.replace('https://api.questtick.com/api/auth/verify-email' + params);
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('.auth-status h2').textContent = 'Ссылка недействительна';
        document.querySelector('.auth-status p').textContent = 'Попробуйте запросить письмо повторно.';
      });
    }
  </script>
</head>
<body>
  <div class="auth-status">
    <h2>Подтверждаем email…</h2>
    <p>Пожалуйста, подождите</p>
  </div>
</body>
</html>
