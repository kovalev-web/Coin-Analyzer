<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questtick — Email verification</title>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-sans-variable.woff2" crossorigin />
  <link rel="stylesheet" href="/src/auth.css" />
  <script>
    var params = window.location.search;
    if (params) {
      window.location.replace('https://api.questtick.com/api/auth/verify-email' + params);
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('.auth-status h2').textContent = 'Link is invalid';
        document.querySelector('.auth-status p').textContent = 'Try requesting a new verification email.';
      });
    }
  </script>
</head>
<body>
  <div class="auth-status">
    <h2>Verifying email…</h2>
    <p>Please wait</p>
  </div>
</body>
</html>
