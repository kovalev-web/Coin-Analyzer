<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questtick — Вход</title>
  <script type="module" src="/src/login.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0e0e0e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }
    #login-card {
      width: 100%;
      max-width: 360px;
      padding: 32px 28px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 28px;
      color: #fff;
    }
    #login-error {
      background: #3a1a1a;
      border: 1px solid #6a2a2a;
      color: #f08080;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    input {
      display: block;
      width: 100%;
      padding: 0 12px;
      height: 38px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #024ad8; }
    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #277CC2;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
    }
    button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
    button[type="submit"]:hover:not(:disabled) { background: #3189d0; }
    #toggle-mode {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 8px;
      background: none;
      border: none;
      color: #666;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    #toggle-mode:hover { color: #999; }
  </style>
</head>
<body>
  <div id="login-card">
    <h1>Questtick</h1>
    <div id="login-error" style="display:none"></div>
    <div id="login-msg" style="display:none;background:#1a2a1a;border:1px solid #2a5a2a;color:#80c080;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.6;margin-bottom:16px;"></div>
    <form id="login-form" autocomplete="on">
      <input type="email" id="email" placeholder="Email" required autocomplete="email">
      <input type="password" id="password" placeholder="Пароль" required autocomplete="current-password">
      <button type="submit" id="submit-btn">Войти</button>
    </form>
    <button id="toggle-mode">Нет аккаунта? Зарегистрироваться</button>
  </div>
</body>
</html>
