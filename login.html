<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questtick — Sign in</title>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-latin.woff2" crossorigin />
  <link rel="stylesheet" href="/src/auth.css" />
  <script type="module" src="/src/login.js"></script>
</head>
<body>
  <div id="login-card" class="auth-card">
    <div class="popup-header auth-header">
      <img src="/favicon.svg" class="auth-logo" alt="" width="28" height="28">
      <h1 class="auth-title">Questtick</h1>
    </div>
    <div class="popup-body">
      <div id="login-msg"></div>
      <button id="google-btn" class="auth-btn-google">
        <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 6.294C4.672 4.169 6.656 3.58 9 3.58z"/></svg>
        <span id="google-btn-text">Sign in with Google</span>
      </button>
      <div class="auth-divider">or</div>
      <form id="login-form" autocomplete="on">
        <input type="email" id="email" placeholder="Email" required autocomplete="email">
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
        <button type="button" id="forgot-btn" class="auth-forgot-link">Forgot password?</button>
        <div id="login-error" class="auth-error"></div>
        <button type="submit" id="submit-btn" class="auth-btn-primary">Sign in</button>
      </form>
    </div>
    <div class="popup-footer">
      <button id="toggle-mode" class="auth-btn-link">No account? Sign up</button>
      <a href="/" class="auth-btn-link auth-demo-link">Try without account</a>
    </div>
  </div>
</body>
</html>
