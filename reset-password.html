<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questtick — Новый пароль</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/auth.css" />
</head>
<body>
  <div class="auth-card">
    <div class="popup-header">
      <h2 class="auth-title">Новый пароль</h2>
    </div>
    <div class="popup-body">
      <input type="password" id="pass" placeholder="Новый пароль" autocomplete="new-password">
      <div class="auth-err-inline" id="pass-err"></div>
      <input type="password" id="confirm" placeholder="Подтвердить пароль" autocomplete="new-password">
      <div class="auth-err-inline" id="confirm-err"></div>
      <button id="btn" class="auth-btn-primary">Сохранить</button>
      <div class="auth-ok" id="ok" style="display:none">Пароль изменён! <a href="/login">Войти</a></div>
    </div>
    <div class="popup-footer">
      <a href="/login" class="auth-back">← Назад к входу</a>
    </div>
  </div>
  <script>
    var token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.querySelector('.auth-title').textContent = 'Ссылка недействительна';
      document.getElementById('btn').disabled = true;
    }
    document.getElementById('btn').addEventListener('click', async function () {
      var pass    = document.getElementById('pass').value;
      var confirm = document.getElementById('confirm').value;
      var passErr = document.getElementById('pass-err');
      var conErr  = document.getElementById('confirm-err');
      passErr.textContent = conErr.textContent = '';

      if (pass.length < 8)      { passErr.textContent = 'Минимум 8 символов'; return; }
      if (pass !== confirm)     { conErr.textContent  = 'Пароли не совпадают'; return; }

      var btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = '…';

      try {
        var r = await fetch('https://api.questtick.com/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, newPassword: pass }),
        });
        if (r.ok) {
          btn.style.display = 'none';
          document.getElementById('ok').style.display = 'block';
        } else {
          var d = await r.json().catch(function() { return {}; });
          passErr.textContent = d.message || 'Ссылка устарела или недействительна';
          btn.disabled = false; btn.textContent = 'Сохранить';
        }
      } catch (e) {
        passErr.textContent = 'Ошибка сети, попробуйте ещё раз';
        btn.disabled = false; btn.textContent = 'Сохранить';
      }
    });
  </script>
</body>
</html>
