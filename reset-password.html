<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questtick — New password</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-sans-variable.woff2" crossorigin />
  <link rel="stylesheet" href="/src/auth.css" />
</head>
<body>
  <div class="auth-card">
    <div class="popup-header">
      <h2 class="auth-title">New password</h2>
    </div>
    <div class="popup-body">
      <input type="password" id="pass" placeholder="New password" autocomplete="new-password">
      <div class="auth-err-inline" id="pass-err"></div>
      <input type="password" id="confirm" placeholder="Confirm password" autocomplete="new-password">
      <div class="auth-err-inline" id="confirm-err"></div>
      <button id="btn" class="auth-btn-primary">Save</button>
      <div class="auth-ok" id="ok" style="display:none">Password changed! <a href="/login">Sign in</a></div>
    </div>
    <div class="popup-footer">
      <a href="/login" class="auth-back">← Back to sign in</a>
    </div>
  </div>
  <script>
    var token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.querySelector('.auth-title').textContent = 'Link is invalid';
      document.getElementById('btn').disabled = true;
    }
    document.getElementById('btn').addEventListener('click', async function () {
      var pass    = document.getElementById('pass').value;
      var confirm = document.getElementById('confirm').value;
      var passErr = document.getElementById('pass-err');
      var conErr  = document.getElementById('confirm-err');
      passErr.textContent = conErr.textContent = '';

      if (pass.length < 8)      { passErr.textContent = 'Minimum 8 characters'; return; }
      if (pass !== confirm)     { conErr.textContent  = 'Passwords do not match'; return; }

      var btn = document.getElementById('btn');
      btn.disabled = true; btn.classList.add('btn-loading');

      try {
        var r = await fetch('https://api.questtick.com/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, newPassword: pass }),
        });
        if (r.ok) {
          btn.style.display = 'none';
          document.getElementById('ok').style.display = 'block';
        } else {
          var d = await r.json().catch(function() { return {}; });
          passErr.textContent = d.message || 'Link has expired or is invalid';
          btn.disabled = false; btn.classList.remove('btn-loading');
        }
      } catch (e) {
        passErr.textContent = 'Network error, please try again';
        btn.disabled = false; btn.textContent = 'Save';
      }
    });
  </script>
</body>
</html>
