<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questtick — Новый пароль</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #0e0e0e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100dvh; margin: 0; }
    .card { width: 100%; max-width: 360px; padding: 32px 24px; }
    h2 { font-size: 20px; font-weight: 700; margin: 0 0 24px; }
    input { width: 100%; padding: 10px 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 14px; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #024ad8; }
    button { width: 100%; padding: 11px; background: #024ad8; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .err { font-size: 13px; color: #f08080; margin: -6px 0 10px; min-height: 18px; }
    .ok  { font-size: 14px; color: #80c080; margin-top: 16px; text-align: center; }
    .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #888; text-decoration: none; }
    .back:hover { color: #e0e0e0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Новый пароль</h2>
    <input type="password" id="pass" placeholder="Новый пароль" autocomplete="new-password">
    <div class="err" id="pass-err"></div>
    <input type="password" id="confirm" placeholder="Подтвердить пароль" autocomplete="new-password">
    <div class="err" id="confirm-err"></div>
    <button id="btn">Сохранить</button>
    <div class="ok" id="ok" style="display:none">Пароль изменён! <a href="/login" style="color:#80c080">Войти</a></div>
    <a href="/login" class="back">← Назад к входу</a>
  </div>
  <script>
    var token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.querySelector('.card h2').textContent = 'Ссылка недействительна';
      document.getElementById('btn').disabled = true;
    }
    document.getElementById('btn').addEventListener('click', async function () {
      var pass    = document.getElementById('pass').value;
      var confirm = document.getElementById('confirm').value;
      var passErr = document.getElementById('pass-err');
      var conErr  = document.getElementById('confirm-err');
      passErr.textContent = conErr.textContent = '';

      if (pass.length < 8)      { passErr.textContent = 'Минимум 8 символов'; return; }
      if (pass !== confirm)     { conErr.textContent  = 'Пароли не совпадают'; return; }

      var btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = '…';

      try {
        var r = await fetch('https://api.questtick.com/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, newPassword: pass }),
        });
        if (r.ok) {
          btn.style.display = 'none';
          document.getElementById('ok').style.display = 'block';
        } else {
          var d = await r.json().catch(function() { return {}; });
          passErr.textContent = d.message || 'Ссылка устарела или недействительна';
          btn.disabled = false; btn.textContent = 'Сохранить';
        }
      } catch (e) {
        passErr.textContent = 'Ошибка сети, попробуйте ещё раз';
        btn.disabled = false; btn.textContent = 'Сохранить';
      }
    });
  </script>
</body>
</html>
